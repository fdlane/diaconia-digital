services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diaconia
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    command: postgres -c wal_level=logical
    volumes:
      - db_data_pg18:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diaconia"]
      interval: 5s
      timeout: 3s
      retries: 10

  zero-cache:
    image: rocicorp/zero:0.23.3000000000
    restart: unless-stopped
    ports:
      - "4848:4848"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:postgres@db:5432/diaconia
      ZERO_APP_ID: diaconia_digital
      ZERO_CVR_DB: postgres://postgres:postgres@db:5432/diaconia
      ZERO_CHANGE_DB: postgres://postgres:postgres@db:5432/diaconia
      ZERO_REPLICA_FILE: /data/zero.db
      ZERO_ADMIN_PASSWORD: dev-admin
      ZERO_QUERY_URL: http://host.docker.internal:4000/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:4000/zero/mutate
      ZERO_AUTH_JWKS_URL: ${ZERO_AUTH_JWKS_URL:-}
      ZERO_AUTH_ISSUER: ${ZERO_AUTH_ISSUER:-}
      ZERO_AUTH_AUDIENCE: ${ZERO_AUTH_AUDIENCE:-diaconia-api}
    volumes:
      - zero_cache_data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data_pg18:
  zero_cache_data:
