name: 1a. Deploy main to AWS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy main to dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      PROJECT: ${{ vars.PROJECT || 'diaconia-foundation' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VARS_CONTENT: ${{ secrets.TF_VARS_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME != ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME == ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare Terraform variables
        id: tfvars
        run: .github/scripts/prepare-tfvars.sh dev "$TF_VARS_CONTENT"

      - name: Build and push images
        id: images
        run: .github/scripts/deploy-images.sh dev ""

      - name: Deploy service images
        run: >
          .github/scripts/deploy-services.sh
          dev
          "${{ steps.tfvars.outputs.tfvars_file }}"
          -var="api_image_tag=${{ steps.images.outputs.image_tag }}"
          -var="admin_image_tag=${{ steps.images.outputs.image_tag }}"
