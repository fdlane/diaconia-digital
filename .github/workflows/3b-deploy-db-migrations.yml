name: 3b. Run db migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub/AWS environment name.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Optional immutable migration image tag. Defaults to migrations-<commit SHA>.
        required: false
        type: string

concurrency:
  group: db-migrations-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    name: Run migrations in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      PROJECT: ${{ vars.PROJECT || 'diaconia-foundation' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME != ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME == ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run migrations
        run: .github/scripts/run-db-migrations.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}"
