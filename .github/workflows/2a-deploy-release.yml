name: 2a. Deploy release to AWS

on:
  release:
    types:
      - published

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy release to prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      PROJECT: ${{ vars.PROJECT || 'diaconia-foundation' }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_JWT_TEMPLATE: ${{ vars.NEXT_PUBLIC_CLERK_JWT_TEMPLATE || 'diaconia-api' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VARS_CONTENT: ${{ secrets.TF_VARS_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME != ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME == ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Prepare Terraform variables
        id: tfvars
        run: .github/scripts/prepare-tfvars.sh prod "$TF_VARS_CONTENT"

      - name: Build and push images
        id: images
        run: .github/scripts/deploy-images.sh prod "${{ github.event.release.tag_name }}" "${{ steps.tfvars.outputs.tfvars_file }}"

      - name: Deploy service images
        run: >
          .github/scripts/deploy-services.sh
          prod
          "${{ steps.tfvars.outputs.tfvars_file }}"
          -var="api_image_tag=${{ steps.images.outputs.image_tag }}"
          -var="admin_image_tag=${{ steps.images.outputs.image_tag }}"

      - name: Deploy mobile web
        id: mobile-web
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CLERK_JWT_TEMPLATE: ${{ env.NEXT_PUBLIC_CLERK_JWT_TEMPLATE }}
        run: >
          .github/scripts/deploy-mobile-web.sh
          prod
          "${{ steps.tfvars.outputs.tfvars_file }}"
          -var="clerk_publishable_key=${{ secrets.CLERK_PUBLISHABLE_KEY }}"
          -var="clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}"
