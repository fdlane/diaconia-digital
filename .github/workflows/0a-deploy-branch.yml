name: 0a. Deploy branch to AWS

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or SHA to deploy. Defaults to the selected workflow ref.
        required: false
        type: string
      environment:
        description: GitHub/AWS environment name.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Optional immutable image tag. Defaults to the checked-out commit SHA.
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.git_ref || github.ref_name }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      PROJECT: ${{ vars.PROJECT || 'diaconia-foundation' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VARS_DEV: ${{ secrets.TF_VARS_DEV }}
      TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME != ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_TO_ASSUME == ''
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Prepare Terraform variables
        id: tfvars
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            tfvars_content="$TF_VARS_PROD"
          else
            tfvars_content="$TF_VARS_DEV"
          fi
          .github/scripts/prepare-tfvars.sh "${{ inputs.environment }}" "$tfvars_content"

      - name: Build and push images
        id: images
        run: .github/scripts/deploy-images.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}"

      - name: Deploy service images
        run: >
          .github/scripts/deploy-services.sh
          "${{ inputs.environment }}"
          "${{ steps.tfvars.outputs.tfvars_file }}"
          -var="api_image_tag=${{ steps.images.outputs.image_tag }}"
          -var="admin_image_tag=${{ steps.images.outputs.image_tag }}"
